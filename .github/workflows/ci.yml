name: CI

# Validation only -- tests, PR build check, and CodeQL security scan on every
# push/PR to main. Deploying to GitHub Pages is a separate, deliberate step
# (see deploy-site.yml) gated on a published release tag, not on every push
# that passes here. A push passing CI means "safe to release", not "now live".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.site }}
      automation: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.automation }}
      skills: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            site:
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'astro.config.mjs'
              - 'tsconfig.json'
            automation:
              - 'automation/**'
            skills:
              - 'skills/**'

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # The dbxmig toolkit under automation/ generates and executes SQL against a
  # customer's Unity Catalog metastore, so it is unit-tested and linted like
  # application code -- not treated as sample snippets. The whole suite runs
  # offline against a JSON fixture, with no cloud credentials.
  automation:
    needs: [changes]
    if: needs.changes.outputs.automation == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest

  # migration-assess is a standalone, dependency-free skill (stdlib only) --
  # distributed on its own, so it deliberately isn't part of the automation/
  # package. Its self-check is a plain script, not pytest, to match.
  skills:
    needs: [changes]
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python3 skills/migration-assess/scripts/test_assess.py

  # `check` is a required status check on main, so the JOB must always run on a
  # PR -- a job skipped by an `if:` reports "skipped" and leaves the requirement
  # unsatisfied, which blocks any PR that touches nothing under src/. The build
  # STEPS are what get skipped when the site is unaffected, so a docs-free PR
  # still reports green in seconds instead of installing node_modules for
  # nothing.
  check:
    # BUG FIXED HERE: a bare `needs: [automation, skills]` made THIS job skip
    # (not just its dependencies) on any PR that doesn't touch automation/**
    # or skills/** -- GitHub Actions' default success() gate for `needs` does
    # NOT treat a job skipped by its own path-filter `if:` as satisfying it,
    # contrary to what the comment this replaces assumed. Since `check` is a
    # required status check, that meant EVERY docs-only PR reported `check`
    # as skipped -- an unsatisfied required check, blocking merge entirely.
    # Confirmed live on PR #179 before this fix.
    #
    # The correct pattern: keep the job running via an explicit `if:` that
    # accepts a needed job's result as either success OR skipped, and
    # `always()` so this job's own conditional evaluation isn't itself
    # short-circuited by a skipped dependency.
    if: |
      always() && github.event_name == 'pull_request' &&
      needs.test.result == 'success' && needs.changes.result == 'success' &&
      (needs.automation.result == 'success' || needs.automation.result == 'skipped') &&
      (needs.skills.result == 'success' || needs.skills.result == 'skipped')
    needs: [test, changes, automation, skills]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - if: needs.changes.outputs.site == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: needs.changes.outputs.site == 'true'
        run: npm ci
      - if: needs.changes.outputs.site == 'true'
        run: npm run check:diagram-wiring
      - if: needs.changes.outputs.site == 'true'
        run: npm run check:internal-links
      - if: needs.changes.outputs.site == 'true'
        run: npm run build
      - if: needs.changes.outputs.site != 'true'
        run: echo "No site sources changed -- build skipped."

  security:
    if: github.event_name != 'pull_request' && needs.changes.outputs.site == 'true'
    needs: [test, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
