name: CI

# Validation only -- tests, PR build check, and CodeQL security scan on every
# push/PR to main. Deploying to GitHub Pages is a separate, deliberate step
# (see deploy-site.yml) gated on a published release tag, not on every push
# that passes here. A push passing CI means "safe to release", not "now live".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            site:
              - 'src/**'
              - 'public/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'astro.config.mjs'
              - 'tsconfig.json'

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  check:
    if: github.event_name == 'pull_request' && needs.changes.outputs.site == 'true'
    needs: [test, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    if: github.event_name != 'pull_request' && needs.changes.outputs.site == 'true'
    needs: [test, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
