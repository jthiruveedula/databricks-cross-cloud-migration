name: Delete stale merged branches

# Weekly hygiene: remove remote branches that are merged and haven't been
# touched in 30+ days. "Merged" is determined via the GitHub API's merged-PR
# list (gh pr list --state merged), not `git branch --merged` — this repo
# merges PRs with --squash, which creates a brand-new commit on main with no
# ancestry back to the original branch tip, so plain git ancestry checks
# never recognize a squash-merged branch as merged. A branch is also treated
# as merged if `git branch -r --merged` independently confirms it (covers
# true fast-forward/merge-commit branches), so either signal is enough — but
# neither alone is sufficient for a repo that squash-merges.
# main is excluded from every list before any deletion logic runs.
# workflow_dispatch is included for an on-demand run without waiting for
# the schedule.
on:
  schedule:
    - cron: "0 3 * * 1" # every Monday, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Delete merged branches older than 30 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -d '30 days ago' +%s)
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"

          git for-each-ref --format='%(refname:short)' "refs/remotes/origin" \
            | sed 's#^origin/##' \
            | grep -vxF "$DEFAULT_BRANCH" \
            | grep -vxF "HEAD" \
            > /tmp/all-branches.txt || true

          git branch -r --merged "origin/$DEFAULT_BRANCH" \
            | sed 's#^[[:space:]]*origin/##' \
            | grep -vxF "$DEFAULT_BRANCH" \
            > /tmp/git-merged-branches.txt || true

          gh pr list --state merged --limit 500 --json headRefName --jq '.[].headRefName' \
            > /tmp/pr-merged-branches.txt || true

          : > /tmp/detail-rows.md
          deleted_count=0
          kept_unmerged_count=0
          kept_recent_count=0
          failed_count=0

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue
            last_commit=$(git log -1 --format=%ct "origin/$branch")
            last_commit_human=$(date -d "@$last_commit" -Iseconds)

            is_merged=false
            if grep -qxF "$branch" /tmp/git-merged-branches.txt || grep -qxF "$branch" /tmp/pr-merged-branches.txt; then
              is_merged=true
            fi

            if [ "$is_merged" = false ]; then
              echo "Keeping $branch — not merged (no merged PR, no git ancestry match)"
              echo "| ⚪ | \`$branch\` | $last_commit_human | no | kept — unmerged |" >> /tmp/detail-rows.md
              kept_unmerged_count=$((kept_unmerged_count + 1))
              continue
            fi

            if [ "$last_commit" -lt "$CUTOFF" ]; then
              echo "Deleting stale merged branch: $branch (last commit $last_commit_human)"
              if git push origin --delete "$branch"; then
                echo "| 🟢 | \`$branch\` | $last_commit_human | yes | **deleted** |" >> /tmp/detail-rows.md
                deleted_count=$((deleted_count + 1))
              else
                echo "::warning::Failed to delete $branch (may be protected or already gone)"
                echo "| 🔴 | \`$branch\` | $last_commit_human | yes | delete failed |" >> /tmp/detail-rows.md
                failed_count=$((failed_count + 1))
              fi
            else
              echo "Keeping $branch — merged but last commit within 30 days"
              echo "| 🟡 | \`$branch\` | $last_commit_human | yes | kept — under 30 days old |" >> /tmp/detail-rows.md
              kept_recent_count=$((kept_recent_count + 1))
            fi
          done < /tmp/all-branches.txt

          {
            echo "### Stale branch cleanup"
            echo ""
            echo "#### Summary"
            echo ""
            echo "| | Count |"
            echo "|---|---|"
            echo "| 🟢 Deleted (merged + 30+ days stale) | $deleted_count |"
            echo "| 🟡 Kept — merged but recent | $kept_recent_count |"
            echo "| ⚪ Kept — not merged | $kept_unmerged_count |"
            if [ "$failed_count" -gt 0 ]; then
              echo "| 🔴 Delete failed | $failed_count |"
            fi
            echo ""
            echo "#### Details"
            echo ""
            echo "| | Branch | Last commit | Merged | Action |"
            echo "|---|---|---|---|---|"
            cat /tmp/detail-rows.md
          } >> "$GITHUB_STEP_SUMMARY"
