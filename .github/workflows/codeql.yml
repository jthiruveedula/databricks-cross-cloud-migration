name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        # 'python' covers the migration automation toolkit under automation/,
        # which generates and executes SQL against a customer's metastore.
        language: ['javascript-typescript', 'python']
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: '/language:${{ matrix.language }}'
