name: Rollback site to a previous release

# Re-deploys a previously published release tag to GitHub Pages without
# cutting a new release -- for when the currently-live release has an issue
# and the fastest fix is "go back to what was live before", not "ship a new
# release that reverts it". Re-publishing an old GitHub Release doesn't fire
# a new `release: published` event, so this is a separate, explicit workflow
# rather than something deploy-site.yml can already do.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to redeploy (e.g. v1.3.0) — must already exist under Releases"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Confirm the tag exists
        run: |
          if ! git rev-parse "refs/tags/${{ inputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag '${{ inputs.tag }}' does not exist in this repo. Check https://github.com/${{ github.repository }}/tags." >&2
            exit 1
          fi

  build:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Record rollback in the run summary
        run: |
          echo "### Rolled back to \`${{ inputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Live site now serves the build from release tag \`${{ inputs.tag }}\`." >> "$GITHUB_STEP_SUMMARY"
